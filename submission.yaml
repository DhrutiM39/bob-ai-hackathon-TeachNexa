submission:
  title: "CourseGenie AI — AI Professor Assistant: From Syllabus to Complete Course"

  problem_statement: >
    College professors and educators spend significant time converting a syllabus
    into a complete, structured course with lectures, explanations, study materials,
    assessments, and revision resources. Students receive fragmented or inconsistent
    learning content, while faculty struggle to provide personalized and continuously
    updated learning support within limited time and resources.

  solution_summary: >
    CourseGenie AI is an AI-powered professor assistant that transforms a course
    syllabus into a complete, structured learning experience using Google Gemini AI
    (via an OpenAI-compatible API). It generates organized, topic-wise course content
    including learning objectives, detailed explanations, key concepts, worked
    examples, MCQ quizzes, and course-wide revision materials — all persisted to
    PostgreSQL and served through a React 18 frontend with JWT-authenticated
    per-user course ownership.

  key_features:
    - "AI course structure generation — syllabus decomposed into 3-8 modules with 2-6 ordered topics each"
    - "Per-topic learning content — objectives, multi-paragraph explanation, key concepts, examples, summary, and further reading"
    - "AI quiz generator — 5-question MCQ per topic with difficulty variation (easy/medium/hard) and answer explanations"
    - "Course-wide revision center — quick notes, key takeaways, practice questions, and full question bank"
    - "JWT authentication with bcrypt password hashing and idempotent content generation (replace, not duplicate)"

  tech_stack:
    languages:
      - "Python 3.11+"
      - "JavaScript (ESM)"
    frameworks:
      - "FastAPI"
      - "React 18"
      - "Vite 5"
      - "React Router v6"
      - "TanStack Query v5"
      - "Zustand"
      - "SQLAlchemy 2.0"
      - "Alembic"
      - "pydantic-settings"
      - "python-jose"
      - "Uvicorn"
      - "Axios"
    ibm_technologies:
      - "IBM Bob (AI-assisted development environment — used throughout the build)"
    databases:
      - "PostgreSQL 15 (JSONB for quiz options; production)"
      - "SQLite (in-memory; test suite only)"
    other:
      - "Google Gemini AI (gemini-1.5-flash via OpenAI-compatible endpoint)"
      - "OpenAI Python SDK (openai>=1.40.0)"
      - "bcrypt (password hashing)"
      - "Docker (PostgreSQL container)"
      - "pytest + httpx (148+ tests)"
      - "CSS Modules"
      - "Git / GitHub"

  what_we_are_most_proud_of: >
    We are most proud of building a fully wired end-to-end pipeline — from a plain
    syllabus paste to a browsable course with per-topic content, quizzes, and
    revision materials — where every AI generation operation is guaranteed to replace
    (never duplicate) existing rows, enforced by database-level unique constraints
    and proven by a comprehensive test suite covering replacement semantics, rollback
    safety, ownership enforcement, and constraint violations across 11 test files.

  known_limitations: >
    The application runs locally only — no production cloud deployment is configured.
    Each AI generation call takes 5–30 seconds depending on Google Gemini API latency;
    the frontend handles this with a named-stage progress indicator. File-upload
    syllabus parsing reads raw bytes only — rich PDF/DOCX text extraction is not
    implemented. A VITE_USE_MOCKS=true mode serves fixture data for offline
    development; mock data is always clearly labelled in the UI.

