submission:
  title: "CourseGenie AI — An AI Professor Assistant: From Syllabus to Complete Course"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    College professors and educators spend significant time converting a syllabus
    into a complete, structured course with lectures, explanations, study
    materials, assessments, and revision resources. Students may receive
    fragmented or inconsistent learning content, while faculty struggle to
    provide personalized and continuously updated learning support within
    limited time and resources.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    CourseGenie AI is an AI-powered professor assistant that transforms a course
    syllabus into a complete, structured learning experience. It generates
    organized course content including topic explanations, lecture material,
    study resources, assessments, and revision support to reduce faculty
    preparation time and provide students with a consistent learning journey.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "AI-powered course generation from a syllabus"
    - "Personalized topic-wise explanations, study materials, and examples"
    - "AI-generated quizzes, questions, and assessments"
    - "Smart revision resources, question banks, and practice material"
    - "Professor AI assistant for automating course-content and assessment creation"                             # optional 5th

  tech_stack:
    languages: ["Python", "JavaScript"]                      # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: ["React", "FastAPI"]                     # e.g., ["FastAPI", "React"]
    ibm_technologies: ["IBM watsonx.ai", "IBM Cloud"]               # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: ["PostgreSQL"]                      # e.g., ["PostgreSQL", "Redis"]
    other: ["Git", "GitHub", "REST APIs"]                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    We are most proud of building CourseGenie AI as a unified professor
    assistant that connects syllabus-based course generation, personalized
    learning content, assessment creation, and revision support in one platform.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    The current implementation may have limitations in content coverage,
    personalization depth, and production-level deployment depending on the
    available development and testing time.

