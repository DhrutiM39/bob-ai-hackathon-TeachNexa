    - "src/backend/tests/test_edit.py"
    - "src/backend/tests/test_file_upload_flow.py"
    - "src/backend/tests/test_generate_endpoint.py"
    - "src/backend/tests/test_health.py"
    - "src/backend/tests/test_syllabus.py"
    - "src/backend/tests/test_topics.py"
