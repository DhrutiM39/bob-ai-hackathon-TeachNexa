submission:
  title: "CourseGenie AI"

  problem_statement: >
    College professors and educators spend significant time converting a syllabus
    into a complete, structured course with lectures, explanations, study materials,
    assessments, and revision resources. Students receive fragmented or inconsistent
    learning content, while faculty struggle to provide personalized and continuously
    updated learning support within limited time and resources.

  solution_summary: >
    CourseGenie AI is an AI-powered professor assistant that transforms a course
    syllabus into a complete, structured learning experience using Google Gemini AI.
    It generates organized, topic-wise course content including learning objectives,
    detailed explanations, key concepts, worked examples, MCQ quizzes, and
    course-wide revision materials, all persisted to PostgreSQL and served through
    a React 18 frontend with JWT-authenticated per-user course ownership.

  key_features:
    - "AI course structure generation from a syllabus"
    - "Per-topic learning content with objectives, explanation, key concepts, and examples"
    - "AI quiz generator producing 5-question MCQs with difficulty variation"
    - "Course-wide revision center with quick notes, key takeaways, and question bank"
    - "JWT authentication with bcrypt password hashing and idempotent content generation"

  tech_stack:
    languages:
      - "Python"
      - "JavaScript"
    frameworks:
      - "FastAPI"
      - "React"
      - "SQLAlchemy"
      - "Alembic"
      - "Vite"
    ibm_technologies:
      - "IBM Bob"
    databases:
      - "PostgreSQL"
    other:
      - "Google Gemini AI"
      - "OpenAI SDK"
      - "Docker"
