# Alembic configuration for CourseGenie AI
# Run from the repository root:
#   alembic -c src/backend/alembic.ini upgrade head

[alembic]
# Path to migration scripts, relative to this ini file
script_location = migrations

# Template used to generate migration file names:
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# The SQLAlchemy connection URL — overridden at runtime by env.py reading DATABASE_URL
sqlalchemy.url = postgresql://coursegenie:changeme@localhost:5432/coursegenie

[post_write_hooks]
# Optionally run black / ruff on generated migration files

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
